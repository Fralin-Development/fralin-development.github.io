name: Auto-Sync Donors from SharePoint

on:
  schedule:
    # Runs every 5 minutes (GitHub Actions cron limit)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-donors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Sync Donors from SharePoint
        run: |
          python scripts/sync_donors.py

      - name: Commit and Push if Changes Found
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add donors.csv
          if git diff --staged --quiet; then
            echo "No donor updates found in SharePoint."
          else
            echo "New donors found! Committing and pushing to main..."
            git commit -m "Auto-sync donors from SharePoint [skip ci]"
            git push origin main
          fi
