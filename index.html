<!DOCTYPE html>
<!--
================================================================================
🎓 CANVAS LMS EMBED SNIPPETS
================================================================================
Option 1 (Default Dark Museum Theme):
<iframe src="https://fralin-development.github.io/?embed=true" width="100%" height="600" style="border:none; border-radius:12px;" allowfullscreen></iframe>

Option 2 (Clean Light Theme for Canvas):
<iframe src="https://fralin-development.github.io/?embed=true&theme=light" width="100%" height="600" style="border:1px solid #e2e8f0; border-radius:12px;" allowfullscreen></iframe>

Option 3 (Transparent / No Header):
<iframe src="https://fralin-development.github.io/?embed=true&bg=transparent&header=false" width="100%" height="500" style="border:none;" allowfullscreen></iframe>

Option 4 (Canvas Module External URL):
URL: https://fralin-development.github.io/?embed=true
================================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fralin Development - Live Donor Roll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Ambient Glow -->
    <div class="ambient-glow"></div>

    <!-- Status & Error Notifications -->
    <div id="status-badge" class="status-badge hidden">
        <span class="pulse-dot"></span>
        <span id="status-text">Live Sync</span>
    </div>

    <div id="error-banner" class="error-banner hidden">
        <div class="error-title">⚠️ Google Sheet Access Notice</div>
        <div id="error-message" class="error-message">Unable to fetch sheet. Make sure sharing is set to <strong>"Anyone with the link can view"</strong>.</div>
    </div>

    <!-- Scrolling Container -->
    <main class="scroll-container" id="scroll-container">
        <div class="scroll-content" id="donor-list">
            <header class="header-section">
                <h1 class="donor-header" id="main-header">Special Thanks to Our Donors</h1>
                <p class="donor-subheader" id="sub-header"></p>
                <div class="header-divider"></div>
            </header>
            
            <div class="donor-items-container" id="donor-items">
                <div class="donor-card loading-state">
                    <div class="donor-name">Loading donors...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- SheetJS for Excel (.xlsx) parsing support -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
