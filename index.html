<!DOCTYPE html>
<!--
================================================================================
🏛️ FRALIN MUSEUM OF ART - LIVE DONOR RECOGNITION ROLL
================================================================================
Default URL (White Background, #127CC2 Poppins Text):
https://fralin-development.github.io/

Custom Display Options:
- Transparent Background: https://fralin-development.github.io/?bg=transparent
- Custom Scroll Speed:    https://fralin-development.github.io/?speed=35
- Dark Gala Theme:        https://fralin-development.github.io/?theme=dark
================================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live Scrolling Donor Recognition Roll for Fralin Museum of Art">
    <!-- Open Graph Metadata for Embeds & Canva/Iframely -->
    <meta property="og:title" content="Fralin Development - Live Donor Roll">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fralin-development.github.io/">
    <meta property="og:description" content="Live Scrolling Donor Recognition Roll for Fralin Museum of Art">
    <link rel="alternate" type="application/json+oembed" href="https://fralin-development.github.io/oembed.json" title="Fralin Development Donor Roll">
    
    <!-- Fonts & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260825a">
</head>
<body>
    <!-- Background Ambient Glow -->
    <div class="ambient-glow"></div>

    <div id="error-banner" class="error-banner hidden">
        <div class="error-title">⚠️ Data Access Notice</div>
        <div id="error-message" class="error-message">Unable to fetch donors.</div>
    </div>

    <!-- Scrolling Container -->
    <main class="scroll-container" id="scroll-container">
        <div class="scroll-content" id="donor-list">
            <header class="header-section">
                <h1 class="donor-header" id="main-header">Thank you to our generous donors who make <em>art together</em> possible</h1>
                <p class="donor-subheader" id="sub-header"></p>
                <div class="header-divider"></div>
            </header>
            
            <div class="donor-items-container" id="donor-items">
                <div class="donor-card loading-state">
                    <div class="donor-name">Loading donors...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- SheetJS for Excel (.xlsx) parsing support -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js?v=20260825a"></script>
</body>
</html>
